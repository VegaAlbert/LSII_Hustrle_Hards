<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Dark mode: applies the saved theme before anything is drawn, so a page with the dark theme never flashes light
      // (or the other way round) while the app loads. Same key and rules as src/theme/themePreference.ts
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('protube.theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'light';
          }
        } catch (e) {
          // Storage blocked: keep the default dark theme
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.style.colorScheme = theme;
        // Text size of the settings, for the same reason. Same key and values as src/settings/preferences.ts
        try {
          var size = JSON.parse(localStorage.getItem('protube.preferences') || '{}').textSize;
          if (size === 'small' || size === 'large') {
            document.documentElement.setAttribute('data-text-size', size);
          }
        } catch (e) {
          // Storage blocked or broken value: default text size
        }
      })();
      // i18n: sets the language of the page before it is drawn (screen readers, hyphenation). Same key and rules as
      // src/i18n/languagePreference.ts: saved language, else the first browser language ProTube speaks, else English
      (function () {
        var supported = ['en', 'es', 'ca'];
        var language = 'en';
        try {
          var saved = localStorage.getItem('protube.language');
          var browser = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          var candidates = saved ? [saved].concat(browser) : browser;
          for (var i = 0; i < candidates.length; i++) {
            var base = String(candidates[i]).toLowerCase().split('-')[0];
            if (supported.indexOf(base) !== -1) {
              language = base;
              break;
            }
          }
        } catch (e) {
          // Storage blocked: keep English
        }
        document.documentElement.lang = language;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/protube-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>ProTube</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
