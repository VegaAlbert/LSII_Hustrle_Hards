# Full ProTube stack (NFR-03): `docker compose up --build` from the repo root, then open http://localhost
# Every variable has a default, so no .env file is needed; override them in a root .env file if required.

services:
  db:
    image: postgres:16
    container_name: protube_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-protube}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-protube}
      POSTGRES_DB: ${ENV_PROTUBE_DB:-protube}
    ports:
      - "${PROTUBE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # A real query (not pg_isready) so a volume initialised with other credentials shows up as unhealthy
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'select 1' > /dev/null"]
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: protube_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Trailing slash required: MvcConfig maps /media/** to file:${pro_tube.store.dir}
      ENV_PROTUBE_STORE_DIR: /data/videos/
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB: ${ENV_PROTUBE_DB:-protube}
      ENV_PROTUBE_DB_USER: ${ENV_PROTUBE_DB_USER:-protube}
      ENV_PROTUBE_DB_PASS: ${ENV_PROTUBE_DB_PASS:-protube}
      ENV_PROTUBE_GOOGLE_CLIENT_ID: ${ENV_PROTUBE_GOOGLE_CLIENT_ID:-}
      ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "${PROTUBE_BACKEND_PORT:-8080}:8080"
    volumes:
      # Video store generated by tooling/videoGrabber (.mp4/.webp/.json triples)
      - ${PROTUBE_STORE_DIR:-./videos}:/data/videos

  frontend:
    build: ./frontend
    container_name: protube_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PROTUBE_FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
