spring.application.name=protube-back
server.port=8080
spring.thymeleaf.prefix=classpath:/static/

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.profiles.active=@spring.profiles.active@

# Before running the process you must have this system-level environment variable set: ENV_PROTUBE_STORE_DIR
# It must hold the absolute path to the directory containing the videos (and any other file-based storage)
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR}

# JWT used to keep users logged in. Set ENV_PROTUBE_JWT_SECRET (>= 32 chars) outside local development
pro_tube.jwt.secret=${ENV_PROTUBE_JWT_SECRET:dev-only-protube-secret-change-me-0123456789}
pro_tube.jwt.expiration-minutes=60

# "Sign in with Google": OAuth client id from Google Cloud Console (not a secret). Empty disables Google login
pro_tube.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:}

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#---
spring.config.activate.on-profile=prod
# Imports the video store on startup when true (idempotent: already imported videos are skipped)
pro_tube.load_initial_data=${ENV_PROTUBE_LOAD_INITIAL_DATA:false}
# For a simpler approach you can reuse the h2 from dev (adjust other config properly)
# spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.static-path-pattern=/media/**
logging.level.org.springframework.web=DEBUG


