# SonarQube / SonarCloud analysis of the whole monorepo (backend + frontend) as one project.
# Run it after the tests, so the coverage reports exist: see DEVELOPMENT.md, "Code quality (SonarQube)".
# The organization (SonarCloud only) and the token are passed by CI or the local scanner, never stored here.
sonar.projectKey=VegaAlbert_LSII_Hustrle_Hards
sonar.projectName=ProTube
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/__tests__/**,frontend/src/**/__mocks__/**,frontend/src/test/**,\
  frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/src/**/__tests__/**,frontend/src/**/__mocks__/**,frontend/src/test/**,\
  frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Backend: compiled classes for the Java analyzer and the JaCoCo report of `mvn clean verify`
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Frontend: lcov report of `npm run test`
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Same exclusions as the coverage tools: bootstrap code with nothing to test
sonar.coverage.exclusions=backend/src/main/java/com/tecnocampus/LS2/protube_back/ProtubeBackApplication.java,\
  frontend/src/main.tsx,frontend/src/vite-env.d.ts
